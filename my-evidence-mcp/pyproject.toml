[project]
name = "grc-evidence-mcp"
version = "0.1.0"
description = "Read-only GRC evidence-collection MCP server for Claude Desktop."
requires-python = ">=3.10"
dependencies = [
    "mcp<2.0.0,>=1.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
screenshot = ["playwright>=1.40.0"]

[project.scripts]
grc-evidence-mcp = "grc_evidence_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grc_evidence_mcp*"]
